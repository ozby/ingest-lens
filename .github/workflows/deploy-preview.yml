name: Deploy preview

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      lane:
        description: "Preview lane: preview_main or preview_pr_<n>"
        required: true
        type: string
      mode:
        description: "deploy or destroy"
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

concurrency:
  group: ingest-lens-preview-${{ github.event.pull_request.number || github.ref_name || inputs.lane }}
  cancel-in-progress: true

jobs:
  resolve:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.resolve.outputs.lane }}
      dashed_lane: ${{ steps.resolve.outputs.dashed_lane }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Resolve preview lane + mode
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_LANE: ${{ inputs.lane }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            lane="preview_main"
            mode="deploy"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            lane="preview_pr_${PR_NUMBER}"
            if [[ "${EVENT_ACTION}" == "closed" ]]; then mode="destroy"; else mode="deploy"; fi
          else
            lane="${MANUAL_LANE}"
            mode="${MANUAL_MODE}"
          fi
          if [[ ! "${lane}" =~ ^preview_main$|^preview_pr_[0-9]+$ ]]; then
            echo "Invalid preview lane: ${lane}" >&2
            exit 1
          fi
          if [[ "${lane}" == "preview_main" ]]; then dashed_lane="preview-main"; else dashed_lane="preview-pr-${lane#preview_pr_}"; fi
          printf 'lane=%s\n' "${lane}" >> "$GITHUB_OUTPUT"
          printf 'dashed_lane=%s\n' "${dashed_lane}" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "${mode}" >> "$GITHUB_OUTPUT"

  preview:
    # pull_request now only fires on `closed` (see `on:` above), which always
    # resolves to mode=destroy, so this deploy path is only ever reachable via
    # push:main or workflow_dispatch — the pull_request fork/collaborator
    # guard that used to gate PR-triggered deploys here is dead code.
    if: ${{ needs.resolve.outputs.mode == 'deploy' && vars.CI_HAS_PREVIEW_TOKEN == 'true' }}
    needs:
      - resolve
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: webpresso/github-actions/.github/workflows/cloudflare-preview.yml@2003ca953f336efb779165f748e1ad8408565428
    with:
      lane: ${{ needs.resolve.outputs.lane }}
      mode: deploy
      install_command: |
        vp install --frozen-lockfile
      verify_command: |
        vp run verify:secrets
        wp lint
        wp typecheck
        vp run test
        wp audit cloudflare-deploy-contract
      deploy_command: bun infra/src/deploy/deploy-preview.ts --lane ${{ needs.resolve.outputs.dashed_lane }}
      destroy_command: bun infra/src/deploy/deploy-preview.ts --lane ${{ needs.resolve.outputs.dashed_lane }} --destroy
      secret_profile: preview
      secret_sink: pulumi
      github_environment: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}

  destroy:
    if: ${{ needs.resolve.outputs.mode == 'destroy' && vars.CI_HAS_PREVIEW_TOKEN == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association) }}
    needs:
      - resolve
    permissions:
      contents: read
      packages: read
      id-token: write
    # Job-level concurrency matches ci.yml's deploy-preview group exactly
    # (rather than this workflow's own `ingest-lens-preview-<n>` group), so
    # closing a PR cancels an in-flight ci.yml deploy of the same lane instead
    # of racing it — the two workflows no longer own separate, colliding
    # deploys of preview_pr_<n>.
    concurrency:
      group: ingest-lens-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: webpresso/github-actions/.github/workflows/cloudflare-preview.yml@2003ca953f336efb779165f748e1ad8408565428
    with:
      lane: ${{ needs.resolve.outputs.lane }}
      mode: destroy
      install_command: |
        vp install --frozen-lockfile
      verify_command: ":"
      deploy_command: ":"
      destroy_command: bun infra/src/deploy/deploy-preview.ts --lane ${{ needs.resolve.outputs.dashed_lane }} --destroy
      secret_profile: preview
      secret_sink: pulumi
      github_environment: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
