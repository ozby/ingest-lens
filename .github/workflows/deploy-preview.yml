name: Deploy preview

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      lane:
        description: "Preview lane to deploy, for example preview_main or preview_pr_123"
        required: true
        type: string

jobs:
  resolve:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    outputs:
      canonical_lane: ${{ steps.resolve.outputs.canonical_lane }}
      dashed_lane: ${{ steps.resolve.outputs.dashed_lane }}
    steps:
      - name: Resolve lane
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF_NAME: ${{ github.ref }}
          MANUAL_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            canonical_lane="preview_main"
            dashed_lane="preview-main"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${PR_NUMBER}"
            if [[ -z "${pr_number}" && "${GITHUB_REF_NAME}" =~ ^refs/pull/([0-9]+)/ ]]; then
              pr_number="${BASH_REMATCH[1]}"
            fi
            canonical_lane="preview_pr_${pr_number}"
            dashed_lane="preview-pr-${pr_number}"
          else
            canonical_lane="${MANUAL_LANE}"
            if [[ "${canonical_lane}" == "preview_main" ]]; then
              dashed_lane="preview-main"
            elif [[ "${canonical_lane}" =~ ^preview_pr_([0-9]+)$ ]]; then
              dashed_lane="preview-pr-${BASH_REMATCH[1]}"
            else
              echo "Invalid preview lane: ${canonical_lane}" >&2
              exit 1
            fi
          fi
          printf 'canonical_lane=%s\n' "${canonical_lane}" >> "$GITHUB_OUTPUT"
          printf 'dashed_lane=%s\n' "${dashed_lane}" >> "$GITHUB_OUTPUT"

  deploy-preview:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association)) }}
    needs: resolve
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: webpresso/github-actions/.github/workflows/cloudflare-preview.yml@53869e557de386bd4d04656b275d6691d153bff9
    with:
      lane: ${{ needs.resolve.outputs.canonical_lane }}
      mode: deploy
      install_command: |
        set -euo pipefail
        vp install --frozen-lockfile
      verify_command: wp lint
      deploy_command: |
        bun infra/src/deploy/deploy-preview.ts --lane ${{ needs.resolve.outputs.dashed_lane }}
      secret_profile: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      neon_api_key: ${{ secrets.NEON_API_KEY }}
      neon_project_id: ${{ secrets.NEON_PROJECT_ID }}
      neon_parent_branch_id: ${{ secrets.NEON_PARENT_BRANCH_ID }}
      pulumi_access_token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      jwt_secret: ${{ secrets.JWT_SECRET }}
      langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}

  destroy-preview:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association) }}
    needs: resolve
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: webpresso/github-actions/.github/workflows/cloudflare-preview.yml@53869e557de386bd4d04656b275d6691d153bff9
    with:
      lane: ${{ needs.resolve.outputs.canonical_lane }}
      mode: destroy
      install_command: |
        set -euo pipefail
        vp install --frozen-lockfile
      verify_command: ":"
      deploy_command: ":"
      destroy_command: |
        bun infra/src/deploy/deploy-preview.ts --lane ${{ needs.resolve.outputs.dashed_lane }} --destroy
      secret_profile: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      neon_api_key: ${{ secrets.NEON_API_KEY }}
      neon_project_id: ${{ secrets.NEON_PROJECT_ID }}
      neon_parent_branch_id: ${{ secrets.NEON_PARENT_BRANCH_ID }}
      pulumi_access_token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      jwt_secret: ${{ secrets.JWT_SECRET }}
      langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}

  deploy-verify:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association)) }}
    needs: deploy-preview
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy verification passed via shared preview caller"
