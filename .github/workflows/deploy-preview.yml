name: Deploy preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      lane:
        description: "Preview lane to deploy, for example preview_main or preview_pr_123"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HAS_DOPPLER_TOKEN: ${{ (secrets.DOPPLER_SERVICE_TOKEN != '' || secrets.DOPPLER_TOKEN != '') && '1' || '' }}
  HAS_CLOUDFLARE_DEPLOY_SECRETS: ${{ (secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_ZONE_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '') && '1' || '' }}
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
  NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

jobs:
  deploy-verify:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm run lint
      - name: Resolve lane
        id: lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF_NAME: ${{ github.ref }}
          MANUAL_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            lane="preview_main"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${PR_NUMBER}"
            if [[ -z "${pr_number}" && "${GITHUB_REF_NAME}" =~ ^refs/pull/([0-9]+)/ ]]; then
              pr_number="${BASH_REMATCH[1]}"
            fi
            lane="preview_pr_${pr_number}"
          else
            lane="${MANUAL_LANE}"
          fi
          if [[ ! "${lane}" =~ ^preview_main$|^preview_pr_[0-9]+$ ]]; then
            echo "Invalid preview lane: ${lane}" >&2
            exit 1
          fi
          printf 'lane=%s\n' "${lane}" >> "$GITHUB_OUTPUT"
      - name: Inject preview deploy credentials from Doppler
        if: env.HAS_DOPPLER_TOKEN == '1'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
          inject-env-vars: true
      - name: Skip preview deploy when deploy secrets are unavailable
        if: ${{ env.HAS_DOPPLER_TOKEN != '1' && env.HAS_CLOUDFLARE_DEPLOY_SECRETS != '1' }}
        run: |
          echo "Preview deploy skipped: no Doppler token or direct Cloudflare deploy secrets available."
      - name: Deploy preview
        if: ${{ env.HAS_DOPPLER_TOKEN == '1' || env.HAS_CLOUDFLARE_DEPLOY_SECRETS == '1' }}
        env:
          DEPLOY_LANE: ${{ steps.lane.outputs.lane }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          lane="${DEPLOY_LANE}"
          # Execute the repo-owned infra deployer through tsx so CI uses the
          # same workspace package resolution surface as local dry-runs.
          if [[ "${lane}" == "preview_main" ]]; then
            preview_lane="preview-main"
          else
            preview_lane="${lane/preview_pr_/preview-pr-}"
          fi
          bun infra/src/deploy/deploy-preview.ts --lane "${preview_lane}"

  destroy:
    name: Destroy PR preview lane
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-monorepo
      - name: Inject preview cleanup credentials from Doppler
        if: env.HAS_DOPPLER_TOKEN == '1'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
          inject-env-vars: true
      - name: Skip preview cleanup when deploy secrets are unavailable
        if: ${{ env.HAS_DOPPLER_TOKEN != '1' && env.HAS_CLOUDFLARE_DEPLOY_SECRETS != '1' }}
        run: |
          echo "Preview cleanup skipped: no Doppler token or direct Cloudflare deploy secrets available."
      - name: Destroy preview
        if: ${{ env.HAS_DOPPLER_TOKEN == '1' || env.HAS_CLOUDFLARE_DEPLOY_SECRETS == '1' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: ${PR_NUMBER}" >&2
            exit 1
          fi
          bun infra/src/deploy/deploy-preview.ts --lane "preview-pr-${PR_NUMBER}" --destroy
