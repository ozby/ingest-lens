name: Security scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly on main
  workflow_dispatch:

jobs:
  auth-preflight:
    name: Auth preflight
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    outputs:
      repo_access_ok: ${{ steps.repo.outputs.repo_access_ok }}
      action_downloads_ok: ${{ steps.actions.outputs.action_downloads_ok }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/refs/tags/v6"
            "https://api.github.com/repos/gitleaks/gitleaks-action/tarball/refs/tags/v2"
            "https://api.github.com/repos/google/osv-scanner-action/tarball/refs/tags/v2.3.8"
            "https://api.github.com/repos/actions/setup-node/tarball/refs/tags/v6"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/refs/tags/v2"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"
  scan:
    name: Secret + dependency scan
    needs: auth-preflight
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'changeset-release/main') && needs.auth-preflight.outputs.repo_access_ok == 'true' && needs.auth-preflight.outputs.action_downloads_ok == 'true' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            ./

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - name: Resolve wp version
        id: wp_version
        shell: bash
        run: echo "version=${WP_SETUP_AGENT_KIT_VERSION:-3.1.17}" >> "$GITHUB_OUTPUT"
      - uses: webpresso/github-actions/.github/actions/setup-wp@c2c71a7a4be446fc6858e6b57bf55a11ccfa2d88
        with:
          version: ${{ steps.wp_version.outputs.version }}
      - name: Check workflow action pins
        run: node scripts/check-workflow-action-pins.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp install --frozen-lockfile
      - name: Secretlint
        run: |
          vp exec secretlint "**/*"
        continue-on-error: false
