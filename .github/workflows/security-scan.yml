name: Security scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly on main
  workflow_dispatch:

jobs:
  scan:
    name: Secret + dependency scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            ./

      - name: Detect GH_PACKAGES_TOKEN package access
        id: detect
        uses: ./.github/actions/detect-webpresso-package-token
        with:
          gh-packages-token: ${{ secrets.GH_PACKAGES_TOKEN }}
          trusted-context: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Setup monorepo dependencies
        if: ${{ steps.detect.outputs.has_packages_token == 'true' }}
        uses: ./.github/actions/setup-monorepo

      - name: Secretlint
        if: ${{ steps.detect.outputs.has_packages_token == 'true' }}
        run: |
          pnpm exec secretlint "**/*"
        continue-on-error: false

      - name: Secretlint skipped (token missing or no package access)
        if: ${{ steps.detect.outputs.has_packages_token != 'true' }}
        run: |
          echo "Fork PR is non-authoritative for private packages; skipping dependency-backed secretlint step."
