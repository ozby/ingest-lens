name: Security scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly on main
  workflow_dispatch:

jobs:
  auth-preflight:
    name: Auth preflight
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    outputs:
      repo_access_ok: ${{ steps.repo.outputs.repo_access_ok }}
      action_downloads_ok: ${{ steps.actions.outputs.action_downloads_ok }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/refs/tags/v6"
            "https://api.github.com/repos/gitleaks/gitleaks-action/tarball/refs/tags/v2"
            "https://api.github.com/repos/google/osv-scanner-action/tarball/refs/tags/v2.3.8"
            "https://api.github.com/repos/actions/setup-node/tarball/refs/tags/v6"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/refs/tags/v2"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"
  scan:
    name: Secret + dependency scan
    needs: auth-preflight
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'changeset-release/main') && needs.auth-preflight.outputs.repo_access_ok == 'true' && needs.auth-preflight.outputs.action_downloads_ok == 'true' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            ./

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "24"
          cache: false
          run-install: false
      - run: vp install -g "@webpresso/agent-config"
      - run: vp install --frozen-lockfile

      - name: Secretlint
        run: |
          vp exec secretlint "**/*"
        continue-on-error: false
