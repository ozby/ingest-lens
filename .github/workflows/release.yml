name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    uses: webpresso/github-actions/.github/workflows/changesets-release.yml@3d89dc46dae56b59815e5bbb638fba02414d59f6
    with:
      install_command: |
        set -euo pipefail
        npm install -g vite-plus @webpresso/agent-config
        vp install --frozen-lockfile
      version_command: vp run version
      publish_command: vp run release:publish
      runner: ubuntu-latest

  # GitHub Actions does not support referencing a reusable-workflow job's
  # outputs directly in a second reusable-workflow job's `with:` or `if:`.
  # This thin bridge job passes the outputs through a regular job so the
  # deploy call below can consume them without triggering a startup_failure.
  gate:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ needs.release.outputs.should_deploy }}
      release_version: ${{ needs.release.outputs.release_version }}
    steps:
      - run: "true"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@3d89dc46dae56b59815e5bbb638fba02414d59f6
    with:
      install_command: |
        set -euo pipefail
        npm install -g vite-plus @webpresso/agent-config
        vp install --frozen-lockfile
      verify_command: vp run lint
      deploy_command: |
        bun infra/src/deploy/deploy-production.ts --release-version "${RELEASE_VERSION}"
      release_version: ${{ needs.gate.outputs.release_version }}
      secret_profile: deploy
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
