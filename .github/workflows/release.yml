name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  release:
    uses: webpresso/github-actions/.github/workflows/changesets-release.yml@3f0136f88a488bc0894ab81ab3c8544b2e8dabf2
    with:
      install_command: |
        set -euo pipefail
        eval "$(node ./scripts/resolve-webpresso-cli-versions.js)"
        npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
        vp install --frozen-lockfile
      version_command: vp run version
      publish_command: vp run release:publish
      runner: ubuntu-latest

  # GitHub Actions does not support referencing a reusable-workflow job's
  # outputs directly in a second reusable-workflow job's `with:` or `if:`.
  # This thin bridge job passes the outputs through a regular job so the
  # deploy call below can consume them without triggering a startup_failure.
  gate:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ needs.release.outputs.should_deploy }}
      release_version: ${{ needs.release.outputs.release_version }}
    steps:
      - run: "true"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@11e2b313823763e5f8ced862d4a798d8070e3628
    with:
      install_command: |
        set -euo pipefail
        eval "$(node ./scripts/resolve-webpresso-cli-versions.js)"
        npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
        vp install --frozen-lockfile
      verify_command: vp run lint
      deploy_command: |
        export CLOUDFLARE_ACCOUNT_ID='${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
        export CLOUDFLARE_API_TOKEN='${{ secrets.CLOUDFLARE_API_TOKEN }}'
        export CLOUDFLARE_ZONE_ID='${{ secrets.CLOUDFLARE_ZONE_ID }}'
        export NEON_API_KEY='${{ secrets.NEON_API_KEY }}'
        export NEON_PROJECT_ID='${{ secrets.NEON_PROJECT_ID }}'
        export NEON_PARENT_BRANCH_ID='${{ secrets.NEON_PARENT_BRANCH_ID }}'
        export PULUMI_ACCESS_TOKEN='${{ secrets.PULUMI_ACCESS_TOKEN }}'
        export BETTER_AUTH_SECRET='${{ secrets.BETTER_AUTH_SECRET }}'
        export JWT_SECRET='${{ secrets.JWT_SECRET }}'
        export LANGFUSE_PUBLIC_KEY='${{ secrets.LANGFUSE_PUBLIC_KEY }}'
        export LANGFUSE_SECRET_KEY='${{ secrets.LANGFUSE_SECRET_KEY }}'
        bun infra/src/deploy/deploy-production.ts --release-version "${RELEASE_VERSION}"
      release_version: ${{ needs.gate.outputs.release_version }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
