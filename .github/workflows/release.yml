name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: webpresso/github-actions/.github/workflows/changesets-release.yml@daf14c54460c7e8f9e870a2077771ef0e098d9e1
    with:
      install_command: pnpm install --frozen-lockfile
      version_command: pnpm run version
      publish_command: pnpm run release:publish
      runner: ubuntu-latest

  deploy:
    needs: release
    if: ${{ needs.release.outputs.should_deploy == 'true' }}
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@daf14c54460c7e8f9e870a2077771ef0e098d9e1
    with:
      install_command: pnpm install --frozen-lockfile
      verify_command: pnpm run lint
      deploy_command: bun infra/src/deploy/deploy-production.ts --release-version "${RELEASE_VERSION}"
      release_version: ${{ needs.release.outputs.release_version }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
