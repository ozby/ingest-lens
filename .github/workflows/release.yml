name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    uses: webpresso/github-actions/.github/workflows/changesets-release.yml@ab90b5f82e4444af1bfe0443edf85632fef9f1e0
    with:
      install_command: |
        set -euo pipefail
        vp install --frozen-lockfile
      version_command: vp run version
      publish_command: vp run release:publish
      runner: ubuntu-latest

  # GitHub Actions does not support referencing a reusable-workflow job's
  # outputs directly in a second reusable-workflow job's `with:` or `if:`.
  # This thin bridge job passes the outputs through a regular job so the
  # deploy call below can consume them without triggering a startup_failure.
  gate:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ needs.release.outputs.should_deploy }}
      release_version: ${{ needs.release.outputs.release_version }}
    steps:
      - run: "true"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@ab90b5f82e4444af1bfe0443edf85632fef9f1e0
    with:
      install_command: |
        set -euo pipefail
        vp install --frozen-lockfile
      verify_command: vp run lint
      deploy_command: |
        bun infra/src/deploy/deploy-production.ts --release-version "${RELEASE_VERSION}"
      release_version: ${{ needs.gate.outputs.release_version }}
      secret_profile: deploy
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      neon_api_key: ${{ secrets.NEON_API_KEY }}
      neon_project_id: ${{ secrets.NEON_PROJECT_ID }}
      neon_parent_branch_id: ${{ secrets.NEON_PARENT_BRANCH_ID }}
      pulumi_access_token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      jwt_secret: ${{ secrets.JWT_SECRET }}
      langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
