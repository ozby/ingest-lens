name: CI (webpresso baseline)

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Opt the workflow's JavaScript actions into Node.js 24 ahead of the
  # 2026-06-02 GitHub default switch (replaces the deprecation warning
  # surfaced by actions/checkout@v4, actions/setup-node@v4, and
  # pnpm/action-setup@v4 internally running on Node 20).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Authenticate to GitHub Packages so `pnpm install --frozen-lockfile`
  # can fetch @webpresso/* scoped deps (e.g. @webpresso/runtime-*,
  # @webpresso/schema-*). The repo's `.npmrc` references
  # ${GH_PACKAGES_TOKEN}; without this env entry the substitution becomes
  # empty and pnpm gets 401 Unauthorized on any @webpresso/* dep.
  GH_PACKAGES_TOKEN: ${{ github.token }}
  NODE_AUTH_TOKEN: ${{ github.token }}

jobs:
  auth-preflight:
    name: Auth preflight
    runs-on: ubuntu-latest
    outputs:
      repo_access_ok: ${{ steps.repo.outputs.repo_access_ok }}
      action_downloads_ok: ${{ steps.actions.outputs.action_downloads_ok }}
      packages_token_ok: ${{ steps.packages.outputs.packages_token_ok }}
    steps:
      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/refs/tags/v5"
            "https://api.github.com/repos/pnpm/action-setup/tarball/refs/tags/v6"
            "https://api.github.com/repos/actions/setup-node/tarball/refs/tags/v5"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/refs/tags/v2"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"
      - name: Probe GitHub Packages token
        id: packages
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PACKAGES_TOKEN:-}" ]; then
            echo "packages_token_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tmp_npmrc="$(mktemp)"
          trap 'rm -f "$tmp_npmrc"' EXIT
          printf '%s\n' \
            '@webpresso:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" \
            >"$tmp_npmrc"
          if ! NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm view @webpresso/agent-kit@latest dist.tarball --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "packages_token_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm pack @webpresso/agent-kit@latest --registry=https://npm.pkg.github.com --ignore-scripts --pack-destination "${RUNNER_TEMP:-/tmp}" >/dev/null 2>&1; then
            echo "packages_token_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages_token_ok=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    if: ${{ needs.auth-preflight.outputs.repo_access_ok == 'true' && needs.auth-preflight.outputs.action_downloads_ok == 'true' && needs.auth-preflight.outputs.packages_token_ok == 'true' }}
    needs: auth-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint

  test:
    if: ${{ needs.auth-preflight.outputs.repo_access_ok == 'true' && needs.auth-preflight.outputs.action_downloads_ok == 'true' && needs.auth-preflight.outputs.packages_token_ok == 'true' }}
    needs: auth-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  wp-audits:
    if: ${{ needs.auth-preflight.outputs.repo_access_ok == 'true' && needs.auth-preflight.outputs.action_downloads_ok == 'true' && needs.auth-preflight.outputs.packages_token_ok == 'true' }}
    needs: auth-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: Run wp audit guardrails
        run: |
          WP="$(pwd)/node_modules/.bin/wp"
          [ -x "$WP" ] || WP=wp
          "$WP" audit guardrails
