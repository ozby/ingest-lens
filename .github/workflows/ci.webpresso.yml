name: CI (webpresso baseline)

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Opt the workflow's JavaScript actions into Node.js 24 ahead of the
  # 2026-06-02 GitHub default switch (replaces the deprecation warning
  # surfaced by actions/checkout@v4, actions/setup-node@v4, and
  # pnpm/action-setup@v4 internally running on Node 20).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Authenticate to GitHub Packages so `pnpm install --frozen-lockfile`
  # can fetch @webpresso/* scoped deps (e.g. @webpresso/runtime-*,
  # @webpresso/schema-*). The repo's `.npmrc` references
  # ${GH_PACKAGES_TOKEN}; without this env entry the substitution becomes
  # empty and pnpm gets 401 Unauthorized on any @webpresso/* dep.
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  token-gate:
    name: Detect package token
    runs-on: ubuntu-latest
    outputs:
      has_packages_token: ${{ steps.detect.outputs.has_packages_token }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect GH_PACKAGES_TOKEN package access
        id: detect
        uses: ./.github/actions/detect-webpresso-package-token
        with:
          gh-packages-token: ${{ secrets.GH_PACKAGES_TOKEN }}

  check:
    if: ${{ needs.token-gate.outputs.has_packages_token == 'true' }}
    needs: token-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint

  test:
    if: ${{ needs.token-gate.outputs.has_packages_token == 'true' }}
    needs: token-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  wp-audits:
    if: ${{ needs.token-gate.outputs.has_packages_token == 'true' }}
    needs: token-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: Run wp audit guardrails
        run: |
          WP="$(pwd)/node_modules/.bin/wp"
          [ -x "$WP" ] || WP=wp
          "$WP" audit guardrails
