name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wp-check:
    name: wp-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/refs/tags/v6"
            "https://api.github.com/repos/actions/setup-node/tarball/refs/tags/v6"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/refs/tags/v2"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"

      - name: Summarize auth preflight
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Auth preflight"
            echo ""
            echo "- repo_access_ok: ${{ steps.repo.outputs.repo_access_ok }}"
            echo "- action_downloads_ok: ${{ steps.actions.outputs.action_downloads_ok }}"
            echo ""
            echo "Remediation:"
            echo "- repo/action probe failed → fix GitHub repository/account access before rerunning CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce auth preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.repo.outputs.repo_access_ok }}" = "true"
          test "${{ steps.actions.outputs.action_downloads_ok }}" = "true"

      - name: Install shared Webpresso CLIs
        shell: bash
        run: |
          set -euo pipefail
          VITE_PLUS_VERSION=$(node -p "require('./package.json').devDependencies['vite-plus'].replace(/^[^0-9]*/, '')")
          AGENT_KIT_VERSION="${WP_SETUP_AGENT_KIT_VERSION:-2.3.2}"
          npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: wp typecheck
      - name: Run targeted test suites
        run: |
          bun test \
            src/*.test.ts \
            infra/src/deploy/runtime-env.test.ts \
            apps/e2e/src/neon-branches.test.ts \
            packages/wrangler-sync/src/index.test.ts
      - run: vp run catalog:check
      - run: vp run blueprints:check

  mutation:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Version Packages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Install shared Webpresso CLIs
        shell: bash
        run: |
          set -euo pipefail
          VITE_PLUS_VERSION=$(node -p "require('./package.json').devDependencies['vite-plus'].replace(/^[^0-9]*/, '')")
          AGENT_KIT_VERSION="${WP_SETUP_AGENT_KIT_VERSION:-2.3.2}"
          npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp install --frozen-lockfile
      - run: wp test --mutation
        env:
          GITHUB_BASE_REF: main

  preview-secret:
    name: Preview token preflight
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.head_ref != 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    outputs:
      has_preview_token: ${{ steps.secret.outputs.has_preview_token }}
    steps:
      - name: Detect preview provider token
        id: secret
        shell: bash
        env:
          CI_SECRET_PROVIDER_TOKEN_PREVIEW: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
        run: |
          set -euo pipefail
          if [[ -n "${CI_SECRET_PROVIDER_TOKEN_PREVIEW}" ]]; then
            echo "has_preview_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_preview_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PR preview deploy because CI_SECRET_PROVIDER_TOKEN_PREVIEW is not configured."
          fi

  deploy-preview:
    name: Deploy preview (PR)
    if: ${{ needs.preview-secret.outputs.has_preview_token == 'true' }}
    needs:
      - wp-check
      - preview-secret
    permissions:
      contents: read
      packages: read
      id-token: write
    concurrency:
      group: ingest-lens-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: webpresso/github-actions/.github/workflows/cloudflare-preview.yml@ba439b2d66ece6f16d3e7fee34bdee3ac5c987c0
    with:
      lane: preview_pr_${{ github.event.pull_request.number }}
      mode: deploy
      install_command: |
        vp install --frozen-lockfile
      verify_command: |
        vp run verify:secrets
        wp lint
        wp typecheck
        vp run test
        wp audit cloudflare-deploy-contract
      deploy_command: bun infra/src/deploy/deploy-preview.ts --lane preview-pr-${{ github.event.pull_request.number }}
      secret_profile: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
