name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wp-check:
    name: wp-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/refs/tags/v6"
            "https://api.github.com/repos/actions/setup-node/tarball/refs/tags/v6"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/refs/tags/v2"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"

      - name: Summarize auth preflight
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Auth preflight"
            echo ""
            echo "- repo_access_ok: ${{ steps.repo.outputs.repo_access_ok }}"
            echo "- action_downloads_ok: ${{ steps.actions.outputs.action_downloads_ok }}"
            echo ""
            echo "Remediation:"
            echo "- repo/action probe failed → fix GitHub repository/account access before rerunning CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce auth preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.repo.outputs.repo_access_ok }}" = "true"
          test "${{ steps.actions.outputs.action_downloads_ok }}" = "true"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "24"
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile

      - run: vp check
      - run: vp run --filter @repo/infra check-types
      - name: Run targeted test suites
        run: |
          bun test \
            src/*.test.ts \
            infra/src/deploy/runtime-env.test.ts \
            apps/e2e/src/neon-branches.test.ts \
            packages/runtime-env-local/src/index.test.ts \
            packages/wrangler-sync/src/index.test.ts
      - run: vp run catalog:check
      - run: vp run blueprints:check

      - name: Validate Lore commits
        run: |
          BASE=${{ github.base_ref || 'main' }}
          git fetch origin "$BASE" --depth=50 2>/dev/null || true
          COMMITS=$(git rev-list --no-merges "origin/$BASE..HEAD" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            echo "No branch commits to validate."
            exit 0
          fi
          FAIL=0
          for SHA in $COMMITS; do
            SUBJECT=$(git log -1 --format="%s" "$SHA")
            if [ "$SUBJECT" = "Version Packages" ]; then
              echo "Skipping lore validation for generated Version Packages commit: $SHA"
              continue
            fi
            git log -1 --format="%B" "$SHA" > /tmp/commit-msg.txt
            WP_SKIP_UPDATE_CHECK=1 vp exec wp audit commit-message --require-lore --message-file /tmp/commit-msg.txt || FAIL=1
          done
          exit $FAIL

  mutation:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Version Packages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "24"
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - run: wp test --mutation
        env:
          GITHUB_BASE_REF: main

  deploy-preview:
    name: Deploy preview (PR)
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.head_ref != 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association) }}
    needs: wp-check
    concurrency:
      group: ingest-lens-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: webpresso/github-actions/.github/workflows/cloudflare-preview.yml@f6fc93375f4ce83c8234341ec22137f43deff148
    with:
      lane: preview_pr_${{ github.event.pull_request.number }}
      mode: deploy
      install_command: |
        vp install --frozen-lockfile
      verify_command: wp lint
      deploy_command: bun infra/src/deploy/deploy-preview.ts --lane preview-pr-${{ github.event.pull_request.number }}
      secret_profile: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
