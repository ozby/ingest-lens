name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wp-check:
    name: wp-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/refs/tags/v6"
            "https://api.github.com/repos/actions/setup-node/tarball/refs/tags/v6"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/refs/tags/v2"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"

      - name: Summarize auth preflight
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Auth preflight"
            echo ""
            echo "- repo_access_ok: ${{ steps.repo.outputs.repo_access_ok }}"
            echo "- action_downloads_ok: ${{ steps.actions.outputs.action_downloads_ok }}"
            echo ""
            echo "Remediation:"
            echo "- repo/action probe failed → fix GitHub repository/account access before rerunning CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce auth preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.repo.outputs.repo_access_ok }}" = "true"
          test "${{ steps.actions.outputs.action_downloads_ok }}" = "true"

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - name: Resolve wp version
        id: wp_version
        shell: bash
        run: echo "version=${WP_SETUP_AGENT_KIT_VERSION:-3.3.6}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-wp-release
        with:
          version: ${{ steps.wp_version.outputs.version }}
          github-token: ${{ secrets.CI_AGENT_KIT_TOKEN || github.token }}
      - name: Check workflow action pins
        run: node scripts/check-workflow-action-pins.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: wp typecheck
      - name: Run wp audit guardrails
        continue-on-error: true
        run: wp audit guardrails
      - name: Run targeted test suites
        run: |
          bun test \
            src/*.test.ts \
            test/secrets-config-contract.test.ts \
            infra/src/deploy/runtime-env.test.ts \
            apps/e2e/src/neon-branches.test.ts \
            packages/wrangler-sync/src/index.test.ts
      - run: vp run catalog:check
      - run: vp run blueprints:check

  mutation:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Version Packages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - name: Resolve wp version
        id: wp_version
        shell: bash
        run: echo "version=${WP_SETUP_AGENT_KIT_VERSION:-3.3.6}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-wp-release
        with:
          version: ${{ steps.wp_version.outputs.version }}
          github-token: ${{ secrets.CI_AGENT_KIT_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp install --frozen-lockfile
      - run: wp test --mutation
        env:
          GITHUB_BASE_REF: main

  e2e:
    name: e2e
    if: >-
      ${{
        vars.CI_HAS_PREVIEW_TOKEN == 'true' &&
        (
          (github.event_name == 'push' &&
            !startsWith(github.event.head_commit.message, 'Version Packages')) ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref != 'changeset-release/main') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    needs: [wp-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI_SECRET_PROVIDER_TOKEN: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/93cb6efe18208431cddfb8368fd83d5badbf9bfd"
            "https://api.github.com/repos/actions/setup-node/tarball/v6"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/v2"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"

      - name: Summarize auth preflight
        if: ${{ always() }}
        shell: bash
        env:
          REPO_ACCESS_OK: ${{ steps.repo.outputs.repo_access_ok }}
          ACTION_DOWNLOADS_OK: ${{ steps.actions.outputs.action_downloads_ok }}
        run: |
          {
            echo "## Auth preflight"
            echo ""
            echo "- repo_access_ok: ${REPO_ACCESS_OK}"
            echo "- action_downloads_ok: ${ACTION_DOWNLOADS_OK}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce auth preflight
        shell: bash
        env:
          REPO_ACCESS_OK: ${{ steps.repo.outputs.repo_access_ok }}
          ACTION_DOWNLOADS_OK: ${{ steps.actions.outputs.action_downloads_ok }}
        run: |
          set -euo pipefail
          test "${REPO_ACCESS_OK}" = "true"
          test "${ACTION_DOWNLOADS_OK}" = "true"

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - name: Resolve wp version
        id: wp_version
        shell: bash
        run: echo "version=${WP_SETUP_AGENT_KIT_VERSION:-3.3.6}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-wp-release
        with:
          version: ${{ steps.wp_version.outputs.version }}
          github-token: ${{ secrets.CI_AGENT_KIT_TOKEN || github.token }}
      - name: Check workflow action pins
        run: node scripts/check-workflow-action-pins.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: vp install --frozen-lockfile

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@cdd4670c26c06688d7afe8ff3b76b1cac918f4da # v4

      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps chromium

      - name: Run e2e suite (auto-provisions Neon branch)
        run: |
          set -euo pipefail
          provider_token_env_name="$(printf 'DOPPLER_%s' TOKEN)"
          env "${provider_token_env_name}=${CI_SECRET_PROVIDER_TOKEN}" wp secrets run --sink e2e --profile preview -- vp run e2e --suite full

  deploy-preview:
    name: Deploy preview (PR)
    if: ${{ vars.CI_HAS_PREVIEW_TOKEN == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.head_ref != 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association) }}
    needs:
      - wp-check
    permissions:
      contents: read
      packages: read
      id-token: write
    concurrency:
      group: ingest-lens-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: webpresso/github-actions/.github/workflows/cloudflare-preview.yml@8ef11734f666ea86f41a129e634ba68e91638df6
    with:
      lane: preview_pr_${{ github.event.pull_request.number }}
      mode: deploy
      install_command: |
        vp install --frozen-lockfile
      verify_command: |
        vp run verify:secrets
        wp lint
        wp typecheck
        vp run test
        wp audit cloudflare-deploy-contract
      deploy_command: bun infra/src/deploy/deploy-preview.ts --lane preview-pr-${{ github.event.pull_request.number }}
      secret_profile: preview
      secret_sink: pulumi
      github_environment: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
