name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version from the merged Changesets Version Packages release"
        required: true
        type: string

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
    steps:
      - name: Validate release version
        id: validate
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION_INPUT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic release version: ${RELEASE_VERSION_INPUT}" >&2
            exit 1
          fi
          printf 'release_version=%s\n' "${RELEASE_VERSION_INPUT}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production release
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate-release
    uses: webpresso/agent-kit/.github/workflows/cloudflare-production.yml@1db9b8d3de11a67096b9cc56ed988ba95d6cc221
    with:
      install_command: |
        export NODE_AUTH_TOKEN='${{ github.token }}'
        cat > "$RUNNER_TEMP/github-packages.npmrc" <<EOF
        @ozby:registry=https://npm.pkg.github.com
        //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
        EOF
        NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/github-packages.npmrc" pnpm install --frozen-lockfile
      verify_command: pnpm run lint
      deploy_command: bun infra/src/deploy/deploy-production.ts --release-version "${RELEASE_VERSION}"
      release_version: ${{ needs.validate-release.outputs.release_version }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
