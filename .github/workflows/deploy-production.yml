name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version from the merged Changesets Version Packages release"
        required: true
        type: string

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
    steps:
      - name: Validate release version
        id: validate
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION_INPUT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic release version: ${RELEASE_VERSION_INPUT}" >&2
            exit 1
          fi
          printf 'release_version=%s\n' "${RELEASE_VERSION_INPUT}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production release
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate-release
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@74fdaf19341304e7dd327dc7008a81d10394cd31
    with:
      install_command: |
        set -euo pipefail
        eval "$(node ./scripts/resolve-webpresso-cli-versions.js)"
        npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
        vp install --frozen-lockfile
      verify_command: vp run lint
      deploy_command: |
        export CLOUDFLARE_ACCOUNT_ID='${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
        export CLOUDFLARE_API_TOKEN='${{ secrets.CLOUDFLARE_API_TOKEN }}'
        export CLOUDFLARE_ZONE_ID='${{ secrets.CLOUDFLARE_ZONE_ID }}'
        export NEON_API_KEY='${{ secrets.NEON_API_KEY }}'
        export NEON_PROJECT_ID='${{ secrets.NEON_PROJECT_ID }}'
        export NEON_PARENT_BRANCH_ID='${{ secrets.NEON_PARENT_BRANCH_ID }}'
        export PULUMI_ACCESS_TOKEN='${{ secrets.PULUMI_ACCESS_TOKEN }}'
        export BETTER_AUTH_SECRET='${{ secrets.BETTER_AUTH_SECRET }}'
        export JWT_SECRET='${{ secrets.JWT_SECRET }}'
        export LANGFUSE_PUBLIC_KEY='${{ secrets.LANGFUSE_PUBLIC_KEY }}'
        export LANGFUSE_SECRET_KEY='${{ secrets.LANGFUSE_SECRET_KEY }}'
        bun infra/src/deploy/deploy-production.ts --release-version "${RELEASE_VERSION}"
      release_version: ${{ needs.validate-release.outputs.release_version }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      neon_api_key: ${{ secrets.NEON_API_KEY }}
      neon_project_id: ${{ secrets.NEON_PROJECT_ID }}
      neon_parent_branch_id: ${{ secrets.NEON_PARENT_BRANCH_ID }}
      pulumi_access_token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      jwt_secret: ${{ secrets.JWT_SECRET }}
      langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
