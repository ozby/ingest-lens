name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version from the merged Changesets Version Packages release"
        required: true
        type: string

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
    steps:
      - name: Validate release version
        id: validate
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION_INPUT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic release version: ${RELEASE_VERSION_INPUT}" >&2
            exit 1
          fi
          printf 'release_version=%s\n' "${RELEASE_VERSION_INPUT}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production release
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate-release
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@ab90b5f82e4444af1bfe0443edf85632fef9f1e0
    with:
      install_command: |
        set -euo pipefail
        vp install --frozen-lockfile
      verify_command: vp run lint
      deploy_command: |
        bun infra/src/deploy/deploy-production.ts --release-version "${RELEASE_VERSION}"
      release_version: ${{ needs.validate-release.outputs.release_version }}
      secret_profile: deploy
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      neon_api_key: ${{ secrets.NEON_API_KEY }}
      neon_project_id: ${{ secrets.NEON_PROJECT_ID }}
      neon_parent_branch_id: ${{ secrets.NEON_PARENT_BRANCH_ID }}
      pulumi_access_token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      jwt_secret: ${{ secrets.JWT_SECRET }}
      langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
