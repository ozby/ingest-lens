name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version from the merged Changesets Version Packages release"
        required: true
        type: string

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
    steps:
      - name: Validate release version
        id: validate
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION_INPUT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic release version: ${RELEASE_VERSION_INPUT}" >&2
            exit 1
          fi
          printf 'release_version=%s\n' "${RELEASE_VERSION_INPUT}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production release
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate-release
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@5bbbe43e6f152b802bcce655a8dadeb661f908b5
    with:
      install_command: |
        export NODE_AUTH_TOKEN='${{ github.token }}'
        pnpm install --frozen-lockfile
      verify_command: wp lint
      deploy_command: bun infra/src/deploy/deploy-production.ts --release-version "${RELEASE_VERSION}"
      release_version: ${{ needs.validate-release.outputs.release_version }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
