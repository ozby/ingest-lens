name: agent-kit audit
on:
  pull_request:
  push:
    branches: [main]

jobs:
  token-gate:
    name: Detect package token
    runs-on: ubuntu-latest
    outputs:
      has_packages_token: ${{ steps.detect.outputs.has_packages_token }}
    steps:
      - name: Detect GH_PACKAGES_TOKEN presence
        id: detect
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -n "${GH_PACKAGES_TOKEN}" ]; then
            echo "has_packages_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages_token=false" >> "$GITHUB_OUTPUT"
          fi

  agent-kit:
    if: ${{ needs.token-gate.outputs.has_packages_token == 'true' }}
    needs: token-gate
    uses: webpresso/agent-kit-action/.github/workflows/audit.yml@v1
    secrets: inherit
    with:
      pr-comment: ${{ github.event_name == 'pull_request' }}
