name: agent-kit audit
on:
  pull_request:
  push:
    branches: [main]

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  agent-kit:
    if: ${{ env.GH_PACKAGES_TOKEN != '' }}
    uses: webpresso/agent-kit-action/.github/workflows/audit.yml@v1
    secrets: inherit
    with:
      pr-comment: ${{ github.event_name == 'pull_request' }}
