name: testing-e2e-act

on:
  workflow_dispatch:

jobs:
  full-suite-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest


      - name: Prove private package auth
        uses: ./.github/actions/detect-webpresso-package-token
        with:
          gh-packages-token: ${{ secrets.GH_PACKAGES_TOKEN }}
          trusted-context: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run e2e suite (auto-provisions Neon branch)
        run: pnpm e2e --suite full
