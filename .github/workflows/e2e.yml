name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    # Fork-PR safety: only run on push-to-main or same-repo PRs.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_AUTH_TOKEN: ${{ github.token }}
      CI_SECRET_PROVIDER_TOKEN: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/refs/tags/v6"
            "https://api.github.com/repos/actions/setup-node/tarball/refs/tags/v6"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/refs/tags/v2"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"

      - name: Summarize auth preflight
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Auth preflight"
            echo ""
            echo "- repo_access_ok: ${{ steps.repo.outputs.repo_access_ok }}"
            echo "- action_downloads_ok: ${{ steps.actions.outputs.action_downloads_ok }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce auth preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.repo.outputs.repo_access_ok }}" = "true"
          test "${{ steps.actions.outputs.action_downloads_ok }}" = "true"

      - uses: ./.github/actions/setup-monorepo

      - name: Install CI secret-provider bridge CLI
        uses: ./.github/actions/setup-ci-secret-provider-cli

      - name: Load CI secret-provider env
        if: ${{ env.CI_SECRET_PROVIDER_TOKEN != '' }}
        uses: ./.github/actions/load-ci-secret-provider-env
        with:
          token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}

      - name: Run e2e suite (auto-provisions Neon branch)
        if: ${{ env.CI_SECRET_PROVIDER_TOKEN != '' }}
        run: pnpm e2e --suite full

      - name: Skip e2e when the CI secret-provider token is unavailable
        if: ${{ env.CI_SECRET_PROVIDER_TOKEN == '' }}
        run: echo "CI_SECRET_PROVIDER_TOKEN is not configured; skipping e2e suite."
