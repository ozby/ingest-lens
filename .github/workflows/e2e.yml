name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets-ready:
    if: >-
      ${{
        (github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, 'Version Packages')) ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref != 'changeset-release/main')
      }}
    runs-on: ubuntu-latest
    outputs:
      has_preview_token: ${{ steps.secret.outputs.has_preview_token }}
    steps:
      - name: Detect preview provider token
        id: secret
        shell: bash
        env:
          CI_SECRET_PROVIDER_TOKEN_PREVIEW: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
        run: |
          set -euo pipefail
          if [[ -n "${CI_SECRET_PROVIDER_TOKEN_PREVIEW}" ]]; then
            echo "has_preview_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_preview_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping e2e because CI_SECRET_PROVIDER_TOKEN_PREVIEW is not configured."
          fi

  e2e:
    needs: secrets-ready
    if: ${{ needs.secrets-ready.outputs.has_preview_token == 'true' }}
    uses: webpresso/github-actions/.github/workflows/wp-e2e.yml@aaf5e03cb7b215bcc8232858ebcf4cbbec2a8c0e
    with:
      install_command: |
        vp install --frozen-lockfile
      e2e_command: vp run e2e --suite full
      secret_profile: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
