name: e2e-act

on:
  workflow_dispatch:

jobs:
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - name: Resolve wp version
        id: wp_version
        shell: bash
        run: echo "version=${WP_SETUP_AGENT_KIT_VERSION:-2.3.2}" >> "$GITHUB_OUTPUT"
      - uses: webpresso/github-actions/.github/actions/setup-wp@c2c71a7a4be446fc6858e6b57bf55a11ccfa2d88
        with:
          version: ${{ steps.wp_version.outputs.version }}
      - name: Check workflow action pins
        run: node scripts/check-workflow-action-pins.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp install --frozen-lockfile
      - name: Install Playwright browser
        run: vp exec --filter @repo/e2e -- playwright install --with-deps chromium

      - name: Run e2e suite (auto-provisions Neon branch)
        run: bun apps/e2e/scripts/e2e-with-neon.ts --suite full
