name: e2e-act

on:
  workflow_dispatch:

jobs:
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUN_E2E: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-monorepo

      - name: Bridge local act secrets
        shell: bash
        env:
          SECRET_MANAGER_TOKEN_SECRET: ${{ secrets.SECRET_MANAGER_TOKEN || secrets.CI_SECRET_PROVIDER_TOKEN }}
          DOPPLER_TOKEN_SECRET: ${{ secrets.CI_SECRET_PROVIDER_TOKEN || secrets.DOPPLER_TOKEN || secrets.SECRET_MANAGER_TOKEN }}
          ENCRYPTION_KEY_SECRET: ${{ secrets.ENCRYPTION_KEY || secrets.JWT_SECRET }}
          CLOUDFLARE_API_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY_SECRET: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID_SECRET: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID_SECRET: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          JWT_SECRET_SECRET: ${{ secrets.JWT_SECRET }}
          BETTER_AUTH_SECRET_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          LANGFUSE_PUBLIC_KEY_SECRET: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY_SECRET: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL_SECRET: ${{ secrets.LANGFUSE_BASE_URL }}
          AUTO_HEAL_THRESHOLD_SECRET: ${{ secrets.AUTO_HEAL_THRESHOLD }}
          LOW_CONFIDENCE_THRESHOLD_SECRET: ${{ secrets.LOW_CONFIDENCE_THRESHOLD }}
        run: |
          set -euo pipefail
          for assignment in \
            "SECRET_MANAGER_TOKEN=$SECRET_MANAGER_TOKEN_SECRET" \
            "DOPPLER_TOKEN=$DOPPLER_TOKEN_SECRET" \
            "ENCRYPTION_KEY=$ENCRYPTION_KEY_SECRET" \
            "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN_SECRET" \
            "NEON_API_KEY=$NEON_API_KEY_SECRET" \
            "NEON_PROJECT_ID=$NEON_PROJECT_ID_SECRET" \
            "NEON_PARENT_BRANCH_ID=$NEON_PARENT_BRANCH_ID_SECRET" \
            "JWT_SECRET=$JWT_SECRET_SECRET" \
            "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET_SECRET" \
            "LANGFUSE_PUBLIC_KEY=$LANGFUSE_PUBLIC_KEY_SECRET" \
            "LANGFUSE_SECRET_KEY=$LANGFUSE_SECRET_KEY_SECRET" \
            "LANGFUSE_BASE_URL=$LANGFUSE_BASE_URL_SECRET" \
            "AUTO_HEAL_THRESHOLD=$AUTO_HEAL_THRESHOLD_SECRET" \
            "LOW_CONFIDENCE_THRESHOLD=$LOW_CONFIDENCE_THRESHOLD_SECRET"; do
            key="${assignment%%=*}"
            value="${assignment#*=}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            if command -v psql >/dev/null 2>&1; then
              psql --version
              exit 0
            fi
            export DEBIAN_FRONTEND=noninteractive
            timeout 180s sudo apt-get update -o Acquire::Retries=3
            timeout 180s sudo apt-get install -y --no-install-recommends postgresql-client
          else
            if command -v psql >/dev/null 2>&1; then
              psql --version
              exit 0
            fi
            export DEBIAN_FRONTEND=noninteractive
            timeout 180s apt-get update -o Acquire::Retries=3
            timeout 180s apt-get install -y --no-install-recommends postgresql-client
          fi

      - name: Install Playwright Chromium
        run: pnpm --dir apps/e2e exec playwright install --with-deps --only-shell chromium

      - name: Run e2e suite (auto-provisions Neon branch)
        run: vp run e2e --suite full
