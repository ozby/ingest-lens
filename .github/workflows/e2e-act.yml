name: e2e-act

on:
  workflow_dispatch:

jobs:
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install shared Webpresso CLIs
        shell: bash
        run: |
          set -euo pipefail
          VITE_PLUS_VERSION=$(node -p "require('./package.json').devDependencies['vite-plus'].replace(/^[^0-9]*/, '')")
          AGENT_KIT_VERSION="${WP_SETUP_AGENT_KIT_VERSION:-2.3.2}"
          npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp install --frozen-lockfile
      - name: Install Playwright browser
        run: vp exec --filter @repo/e2e -- playwright install --with-deps chromium

      - name: Run e2e suite (auto-provisions Neon branch)
        run: bun apps/e2e/scripts/e2e-with-neon.ts --suite full
