name: Deploy preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      lane:
        description: "Preview lane to deploy, for example preview-main or preview-pr-123"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_PACKAGES_TOKEN: ${{ github.token }}
  NODE_AUTH_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: Deploy preview lane
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: wp lint
      - run: wp typecheck
      - run: wp test
      - name: Resolve lane
        id: lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            lane="preview-main"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            lane="preview-pr-${PR_NUMBER}"
          else
            lane="${MANUAL_LANE}"
          fi
          if [[ ! "${lane}" =~ ^preview-main$|^preview-pr-[0-9]+$ ]]; then
            echo "Invalid preview lane: ${lane}" >&2
            exit 1
          fi
          printf 'lane=%s\n' "${lane}" >> "$GITHUB_OUTPUT"
      - name: Deploy preview
        run: with-secrets -- vp run deploy:preview -- --lane "${{ steps.lane.outputs.lane }}"

  destroy:
    name: Destroy PR preview lane
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: Destroy preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: ${PR_NUMBER}" >&2
            exit 1
          fi
          with-secrets -- vp run deploy:preview -- --lane "preview-pr-${PR_NUMBER}" --destroy
