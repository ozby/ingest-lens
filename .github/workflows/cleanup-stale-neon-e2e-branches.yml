name: cleanup-stale-neon-e2e-branches

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  secrets-ready:
    runs-on: ubuntu-latest
    outputs:
      has_preview_token: ${{ steps.secret.outputs.has_preview_token }}
    steps:
      - name: Detect preview provider token
        id: secret
        shell: bash
        env:
          CI_SECRET_PROVIDER_TOKEN_PREVIEW: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
        run: |
          set -euo pipefail
          if [[ -n "${CI_SECRET_PROVIDER_TOKEN_PREVIEW}" ]]; then
            echo "has_preview_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_preview_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping cleanup because CI_SECRET_PROVIDER_TOKEN_PREVIEW is not configured."
          fi

  cleanup:
    needs: secrets-ready
    if: ${{ needs.secrets-ready.outputs.has_preview_token == 'true' }}
    uses: webpresso/github-actions/.github/workflows/wp-cleanup-preview.yml@aaf5e03cb7b215bcc8232858ebcf4cbbec2a8c0e
    with:
      install_command: |
        vp install --frozen-lockfile
      cleanup_command: vp run --filter @repo/e2e db:branch:cleanup
      secret_profile: preview
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
