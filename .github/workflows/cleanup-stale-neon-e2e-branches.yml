name: cleanup-stale-neon-e2e-branches

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  auth-preflight:
    name: Auth preflight
    runs-on: ubuntu-latest
    outputs:
      repo_access_ok: ${{ steps.repo.outputs.repo_access_ok }}
      action_downloads_ok: ${{ steps.actions.outputs.action_downloads_ok }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Probe repository access
        id: repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "repo_access_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_access_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe public action downloads
        id: actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          urls=(
            "https://api.github.com/repos/actions/checkout/tarball/refs/tags/v6"
            "https://api.github.com/repos/actions/setup-node/tarball/refs/tags/v6"
            "https://api.github.com/repos/oven-sh/setup-bun/tarball/refs/tags/v2"
            "https://api.github.com/repos/dopplerhq/secrets-fetch-action/tarball/refs/tags/v2.0.0"
          )
          for url in "${urls[@]}"; do
            if ! curl -fsSIL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$url" >/dev/null; then
              echo "action_downloads_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "action_downloads_ok=true" >> "$GITHUB_OUTPUT"
  cleanup:
    if: ${{ needs.auth-preflight.outputs.repo_access_ok == 'true' && needs.auth-preflight.outputs.action_downloads_ok == 'true' }}
    needs: auth-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_AUTH_TOKEN: ${{ github.token }}
      HAS_DOPPLER_TOKEN: ${{ (secrets.DOPPLER_SERVICE_TOKEN != '' || secrets.DOPPLER_TOKEN != '') && '1' || '' }}
      HAS_DIRECT_NEON_SECRETS: ${{ secrets.NEON_API_KEY != '' && secrets.NEON_PROJECT_ID != '' && secrets.NEON_PARENT_BRANCH_ID != '' && '1' || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-monorepo

      - name: Inject Neon control-plane secrets from Doppler
        if: env.HAS_DOPPLER_TOKEN == '1'
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Skip when neither Doppler nor direct Neon credentials are available
        if: env.HAS_DOPPLER_TOKEN != '1' && env.HAS_DIRECT_NEON_SECRETS != '1'
        run: echo "Skipping Neon cleanup because no secret-manager token or direct Neon credentials are configured."

      - name: Cleanup stale e2e branches via Doppler-managed env
        if: env.HAS_DOPPLER_TOKEN == '1'
        run: vp run --filter @repo/e2e db:branch:cleanup

      - name: Cleanup stale e2e branches via direct GitHub Secrets fallback
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
        if: env.HAS_DOPPLER_TOKEN != '1' && env.HAS_DIRECT_NEON_SECRETS == '1'
        run: vp run --filter @repo/e2e db:branch:cleanup

  cleanup-skipped:
    if: ${{ needs.auth-preflight.outputs.repo_access_ok != 'true' || needs.auth-preflight.outputs.action_downloads_ok != 'true' }}
    needs: auth-preflight
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping stale Neon cleanup because auth preflight failed (repo access or action downloads)."
