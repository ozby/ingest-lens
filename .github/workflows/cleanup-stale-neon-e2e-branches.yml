name: cleanup-stale-neon-e2e-branches

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  secrets-ready:
    runs-on: ubuntu-latest
    outputs:
      has_preview_token: ${{ steps.secret.outputs.has_preview_token }}
    steps:
      - name: Detect preview provider token
        id: secret
        shell: bash
        env:
          CI_SECRET_PROVIDER_TOKEN_PREVIEW: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}
        run: |
          set -euo pipefail
          if [[ -n "${CI_SECRET_PROVIDER_TOKEN_PREVIEW}" ]]; then
            echo "has_preview_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_preview_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping cleanup because CI_SECRET_PROVIDER_TOKEN_PREVIEW is not configured."
          fi

  cleanup:
    needs: secrets-ready
    if: ${{ needs.secrets-ready.outputs.has_preview_token == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI_SECRET_PROVIDER_TOKEN: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PREVIEW }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - uses: webpresso/agent-kit/.github/actions/setup-wp@9e10b3494d4db019c89fe56f6a0286995b5ce772
      - name: Check workflow action pins
        run: node scripts/check-workflow-action-pins.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: vp install --frozen-lockfile

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@cdd4670c26c06688d7afe8ff3b76b1cac918f4da # v4

      - name: Cleanup stale Neon e2e branches
        run: |
          set -euo pipefail
          provider_token_env_name="$(printf 'DOPPLER_%s' TOKEN)"
          env "${provider_token_env_name}=${CI_SECRET_PROVIDER_TOKEN}" wp secrets run --sink e2e --profile preview -- vp run --filter @repo/e2e db:branch:cleanup
