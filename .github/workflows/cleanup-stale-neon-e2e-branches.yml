name: cleanup-stale-neon-e2e-branches

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  token-gate:
    name: Prove private package auth
    runs-on: ubuntu-latest
    outputs:
      has_packages_token: ${{ steps.detect.outputs.has_packages_token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Prove GH_PACKAGES_TOKEN can fetch lockfile private packages
        id: detect
        uses: ./.github/actions/detect-webpresso-package-token
        with:
          gh-packages-token: ${{ secrets.GH_PACKAGES_TOKEN }}
          trusted-context: "true"

  cleanup:
    needs: token-gate
    if: ${{ needs.token-gate.outputs.has_packages_token == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      HAS_DOPPLER_TOKEN: ${{ (secrets.DOPPLER_SERVICE_TOKEN != '' || secrets.DOPPLER_TOKEN != '') && '1' || '' }}
      HAS_DIRECT_NEON_SECRETS: ${{ secrets.NEON_API_KEY != '' && secrets.NEON_PROJECT_ID != '' && secrets.NEON_PARENT_BRANCH_ID != '' && '1' || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject Neon control-plane secrets from Doppler
        if: env.HAS_DOPPLER_TOKEN == '1'
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Skip when neither Doppler nor direct Neon credentials are available
        if: env.HAS_DOPPLER_TOKEN != '1' && env.HAS_DIRECT_NEON_SECRETS != '1'
        run: echo "Skipping Neon cleanup because no secret-manager token or direct Neon credentials are configured."

      - name: Cleanup stale e2e branches via Doppler-managed env
        if: env.HAS_DOPPLER_TOKEN == '1'
        run: pnpm --filter @repo/e2e run db:branch:cleanup

      - name: Cleanup stale e2e branches via direct GitHub Secrets fallback
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
        if: env.HAS_DOPPLER_TOKEN != '1' && env.HAS_DIRECT_NEON_SECRETS == '1'
        run: pnpm --filter @repo/e2e run db:branch:cleanup
