name: testing-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  token-gate:
    name: Detect package token
    runs-on: ubuntu-latest
    outputs:
      has_packages_token: ${{ steps.detect.outputs.has_packages_token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Detect GH_PACKAGES_TOKEN package access
        id: detect
        uses: ./.github/actions/detect-webpresso-package-token
        with:
          gh-packages-token: ${{ secrets.GH_PACKAGES_TOKEN }}
          trusted-context: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  full-suite:
    # Fork-PR safety: only run on push-to-main or same-repo PRs.
    if: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.token-gate.outputs.has_packages_token == 'true' }}
    needs: token-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      HAS_DOPPLER_TOKEN: ${{ (secrets.DOPPLER_SERVICE_TOKEN != '' || secrets.DOPPLER_TOKEN != '') && '1' || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject e2e secrets from Doppler
        if: env.HAS_DOPPLER_TOKEN == '1'
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Run e2e suite (auto-provisions Neon branch)
        run: pnpm e2e --suite full
