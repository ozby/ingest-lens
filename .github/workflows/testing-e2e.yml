name: testing-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  token-gate:
    name: Detect package token
    runs-on: ubuntu-latest
    outputs:
      has_packages_token: ${{ steps.detect.outputs.has_packages_token }}
    steps:
      - name: Detect GH_PACKAGES_TOKEN presence
        id: detect
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -n "${GH_PACKAGES_TOKEN}" ]; then
            echo "has_packages_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages_token=false" >> "$GITHUB_OUTPUT"
          fi

  full-suite:
    # Fork-PR safety: only run on push-to-main or same-repo PRs.
    if: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.token-gate.outputs.has_packages_token == 'true' }}
    needs: token-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@webpresso"

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Doppler CLI
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run e2e suite (auto-provisions Neon branch)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        run: pnpm e2e --suite full
