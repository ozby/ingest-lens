name: Detect Webpresso package token
description: Proves whether GH_PACKAGES_TOKEN can fetch every private @webpresso/@ozby tarball in pnpm-lock.yaml.
inputs:
  gh-packages-token:
    description: Token used for npm.pkg.github.com
    required: false
    default: ""
  trusted-context:
    description: "true for same-repo PRs, push, schedule, and workflow_dispatch; false for fork PRs"
    required: true
  lockfile-path:
    description: Lockfile whose private GitHub Packages tarballs must be fetched
    required: false
    default: pnpm-lock.yaml
outputs:
  has_packages_token:
    description: "true when trusted package auth can fetch all private lockfile tarballs"
    value: ${{ steps.detect.outputs.has_packages_token }}
  authoritative:
    description: "true when this was a trusted-context authoritative gate; false only for explicit fork skips"
    value: ${{ steps.detect.outputs.authoritative }}
  package_count:
    description: Number of private GitHub Packages tarballs checked from the lockfile
    value: ${{ steps.detect.outputs.package_count }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        GH_PACKAGES_TOKEN: ${{ inputs.gh-packages-token }}
        TRUSTED_CONTEXT: ${{ inputs.trusted-context }}
        LOCKFILE_PATH: ${{ inputs.lockfile-path }}
      run: node "$GITHUB_ACTION_PATH/private-package-proof.mjs"
