name: Detect Webpresso package token
description: Checks whether GH_PACKAGES_TOKEN can download @webpresso npm tarballs.
inputs:
  gh-packages-token:
    description: Token used for npm.pkg.github.com
    required: false
    default: ""
outputs:
  has_packages_token:
    description: "true when token is present and can fetch @webpresso package tarballs"
    value: ${{ steps.detect.outputs.has_packages_token }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        GH_PACKAGES_TOKEN: ${{ inputs.gh-packages-token }}
      run: |
        if [ -z "${GH_PACKAGES_TOKEN:-}" ]; then
          echo "has_packages_token=false" >> "$GITHUB_OUTPUT"
          echo "GH_PACKAGES_TOKEN is missing."
          exit 0
        fi

        tmp_npmrc="$(mktemp)"
        cat >"$tmp_npmrc" <<'EOF'
@webpresso:registry=https://npm.pkg.github.com
//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}
always-auth=true
EOF

        tarball_url="$(
          GH_PACKAGES_TOKEN="$GH_PACKAGES_TOKEN" \
          NPM_CONFIG_USERCONFIG="$tmp_npmrc" \
          npm view @webpresso/agent-kit@latest dist.tarball --registry=https://npm.pkg.github.com 2>/dev/null || true
        )"

        rm -f "$tmp_npmrc"

        if [ -z "${tarball_url:-}" ]; then
          echo "has_packages_token=false" >> "$GITHUB_OUTPUT"
          echo "GH_PACKAGES_TOKEN cannot resolve @webpresso/agent-kit metadata."
          exit 0
        fi

        http_code="$(
          curl -sSL -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_PACKAGES_TOKEN}" \
            "$tarball_url"
        )"

        if [ "$http_code" = "200" ]; then
          echo "has_packages_token=true" >> "$GITHUB_OUTPUT"
          echo "GH_PACKAGES_TOKEN can download @webpresso packages."
        else
          echo "has_packages_token=false" >> "$GITHUB_OUTPUT"
          echo "GH_PACKAGES_TOKEN cannot download @webpresso packages (HTTP ${http_code})."
        fi
