name: Load CI secret-provider env
description: Inject CI secrets for this repo through the configured secret-provider bridge
inputs:
  token:
    description: Bootstrap token for the configured CI secret-provider bridge
    required: true
runs:
  using: composite
  steps:
    - name: Export generic secret-manager bootstrap token
      shell: bash
      run: |
        {
          echo "SECRET_MANAGER_TOKEN<<__SECRET_MANAGER_TOKEN__"
          echo "${{ inputs.token }}"
          echo "__SECRET_MANAGER_TOKEN__"
        } >> "$GITHUB_ENV"

    - name: Load secret-provider env
      uses: dopplerhq/secrets-fetch-action@v2.0.0
      with:
        doppler-token: ${{ inputs.token }}
        inject-env-vars: true
