name: Probe GitHub Packages token
description: Check whether a token can read the private GitHub Packages dependency surface.

inputs:
  token:
    description: Token to probe against npm.pkg.github.com.
    required: false
    default: ""
  package-name:
    description: Package used as the read-access probe.
    required: false
    default: "@ozby/wrangler-sync"
  package-version:
    description: Package version used as the read-access probe.
    required: false
    default: "0.1.0"

outputs:
  packages_token_ok:
    description: "true when the token can read the probe package; otherwise false."
    value: ${{ steps.probe.outputs.packages_token_ok }}

runs:
  using: composite
  steps:
    - name: Probe package read access
      id: probe
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        PROBE_PACKAGE_NAME: ${{ inputs.package-name }}
        PROBE_PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        set -euo pipefail

        if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
          echo "packages_token_ok=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        npmrc_dir="$(mktemp -d)"
        trap 'rm -rf "${npmrc_dir}"' EXIT
        npmrc_path="${npmrc_dir}/.npmrc"
        {
          echo "@ozby:registry=https://npm.pkg.github.com"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}"
        } > "${npmrc_path}"

        if npm --userconfig "${npmrc_path}" view "${PROBE_PACKAGE_NAME}@${PROBE_PACKAGE_VERSION}" version >/dev/null 2>&1; then
          echo "packages_token_ok=true" >> "${GITHUB_OUTPUT}"
        else
          echo "packages_token_ok=false" >> "${GITHUB_OUTPUT}"
        fi
