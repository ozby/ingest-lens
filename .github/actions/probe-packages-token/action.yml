name: Probe GitHub Packages token
description: >
  Test whether a GitHub token can access the @webpresso/agent-kit package
  on GitHub Packages. Sets packages_token_ok=true|false.
inputs:
  token:
    description: GitHub token to authenticate against GitHub Packages
    required: true
outputs:
  packages_token_ok:
    description: "true if the token can read @webpresso/agent-kit, false otherwise"
    value: ${{ steps.probe.outputs.packages_token_ok }}
runs:
  using: composite
  steps:
    - name: Test registry access
      id: probe
      shell: bash
      env:
        GH_PACKAGES_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -z "${GH_PACKAGES_TOKEN:-}" ]; then
          echo "packages_token_ok=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        tmp_npmrc="$(mktemp)"
        trap 'rm -f "$tmp_npmrc"' EXIT
        printf '%s\n' \
          '@webpresso:registry=https://npm.pkg.github.com' \
          "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" \
          >"$tmp_npmrc"
        AGENT_KIT_VERSION=$(grep '"@webpresso/agent-kit":' pnpm-workspace.yaml | head -1 | sed 's/.*: *//')
        if ! NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm view "@webpresso/agent-kit@${AGENT_KIT_VERSION}" dist.tarball --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
          echo "packages_token_ok=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm pack "@webpresso/agent-kit@${AGENT_KIT_VERSION}" --registry=https://npm.pkg.github.com --ignore-scripts --pack-destination "${RUNNER_TEMP:-/tmp}" >/dev/null 2>&1; then
          echo "packages_token_ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "packages_token_ok=false" >> "$GITHUB_OUTPUT"
        fi
