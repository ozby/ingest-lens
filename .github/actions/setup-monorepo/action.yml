name: Setup monorepo
description: Install Node 24 + pnpm 10 + Bun, then install dependencies

inputs:
  fetch-depth:
    description: Git fetch depth
    default: "1"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://npm.pkg.github.com
        scope: "@webpresso"

    - name: Enable Corepack pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@10.33.0 --activate

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install global wp
      run: npm install -g @webpresso/agent-kit@latest
      shell: bash

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
