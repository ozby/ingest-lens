name: Setup monorepo
description: Install Node 24 + pnpm + Bun + Vite+, then install dependencies through vp

inputs:
  fetch-depth:
    description: Git fetch depth
    default: "1"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@10.33.0 --activate

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
      with:
        node-version: "24"
        cache: false
        run-install: false

    - name: Install shared wp CLI
      shell: bash
      run: |
        set -euo pipefail
        eval "$(node ./scripts/resolve-webpresso-cli-versions.js)"
        vp install -g "@webpresso/agent-kit@${AGENT_KIT_VERSION}"

    - name: Install dependencies
      run: vp install --frozen-lockfile
      shell: bash
