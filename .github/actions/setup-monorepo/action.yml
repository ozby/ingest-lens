name: Setup monorepo
description: Install Node 24 + pnpm 10 + Bun, then install dependencies

inputs:
  fetch-depth:
    description: Git fetch depth
    default: "1"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://npm.pkg.github.com
        scope: "@webpresso"

    - name: Enable Corepack pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@10.33.0 --activate

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install global wp from npmjs
      shell: bash
      run: |
        set -euo pipefail
        tmp_npmrc="$(mktemp)"
        trap 'rm -f "$tmp_npmrc"' EXIT
        NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm install -g @webpresso/agent-kit@0.28.0 --registry=https://registry.npmjs.org

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
