packages:
  - "."
  - "apps/*"
  - "apps/lab/scenarios/*"
  - "packages/*"
  - infra

catalog:
  # Runtime — shared across ≥2 apps

  # Shared UI / frontend (client + @webpresso/ui)
  "@webpresso/ui": 0.2.2

  # Stryker mutation testing
  "@changesets/cli": ^2.29.5
  "@playwright/test": ^1.60.0
  "@stryker-mutator/core": ^9.6.1
  "@stryker-mutator/typescript-checker": ^9.6.1
  "@stryker-mutator/vitest-runner": ^9.6.1

  # Shared dev types
  "@types/node": ^25.6.0
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3

  # Shared build tools
  "@vitejs/plugin-react": ^6.0.3
  "@neondatabase/api-client": ^1.13.0

  # Webpresso package-source split:
  # - app-config is the consumer-installed package surface
  # - runtime exposes environment tooling through its explicit env subpath
  "@webpresso/app-config": "0.5.1"
  "@webpresso/runtime": 0.7.2
  axios: ^1.15.2
  better-auth: ^1.6.9
  bunchee: ^6.10.0
  husky: ^9.1.7
  lucide-react: ^1.8.0
  react: ^19.2.5
  react-dom: ^19.2.5
  react-hook-form: ^7.73.1
  sonner: ^2.0.7
  tailwindcss: ^4.2.4

  # Task runner
  vite-plus: ^0.2.1
  tsx: ^4.22.4

catalogs:
  tooling:
    typescript: 7.0.2
    vite: ^8.1.5
    vitest: ^4.1.5

  workers:
    "@cloudflare/vitest-pool-workers": ^0.14.9
    "@cloudflare/workers-types": ^4.20260423.1
    drizzle-kit: ^0.31.10
    drizzle-orm: ^0.45.2
    hono: ^4.12.14
    postgres: ^3.4.9
    wrangler: ^4.84.1
confirmModulesPurge: false

allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  tldjs: true
  workerd: true
  "@webpresso/agent-vitest": true
  "@webpresso/agent-workers-test": true

overrides:
  "@commitlint/config-validator>ajv": "8.18.0"
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "@secretlint/config-loader>ajv": "8.18.0"
  "@textlint/linter-formatter>js-yaml": "3.14.2"
  "@textlint/linter-formatter>lodash": "4.18.1"
  "@voidzero-dev/vite-plus-core>yaml": "2.8.3"
  "micromatch>picomatch": "2.3.2"
  protobufjs: "7.5.5"
  "table>ajv": "8.18.0"

peerDependencyRules:
  allowedVersions:
    "vite>esbuild": "*"

# Stryker core bare-imports `typescript` (undeclared) for its sandbox tsconfig
# preprocessor; under this repo's TypeScript 7 that import lacks
# ts.parseConfigFileTextToJson and every mutation run dies at startup. Inject the
# TS6 compiler-API bridge as core's own dependency so only stryker sees it.
packageExtensions:
  "@stryker-mutator/core":
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2
