packages:
  - "."
  - "apps/*"
  - "apps/lab/scenarios/*"
  - "packages/*"
  - infra

catalog:
  # Runtime — shared across ≥2 apps

  # Shared UI / frontend (client + packages/ui)
  "@radix-ui/react-checkbox": ^1.3.3
  "@radix-ui/react-dialog": ^1.1.15
  "@radix-ui/react-dropdown-menu": ^2.1.16
  "@radix-ui/react-label": ^2.1.8
  "@radix-ui/react-select": ^2.2.6
  "@radix-ui/react-slot": ^1.2.4
  "@radix-ui/react-tabs": ^1.1.13
  "@radix-ui/react-toast": ^1.2.15
  "@radix-ui/react-tooltip": ^1.2.8

  # Stryker mutation testing
  "@changesets/cli": ^2.29.5
  "@playwright/test": ^1.60.0
  "@stryker-mutator/core": ^9.6.1
  "@stryker-mutator/typescript-checker": ^9.6.1
  "@stryker-mutator/vitest-runner": ^9.6.1

  # Shared dev types
  "@types/node": ^25.6.0
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3

  # Shared build tools
  "@vitejs/plugin-react": ^6.0.1
  "@neondatabase/api-client": ^1.13.0

  # Webpresso package-source split:
  # - agent-config is the consumer-installed package surface
  # - runtime-env is public npm
  "@webpresso/agent-config": ^0.1.4
  "@webpresso/runtime-env": 0.1.0
  axios: ^1.15.2
  better-auth: ^1.6.9
  bunchee: ^6.10.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  husky: ^9.1.7
  lucide-react: ^1.8.0
  next-themes: ^0.4.6
  react: ^19.2.5
  react-dom: ^19.2.5
  react-hook-form: ^7.73.1
  sonner: ^2.0.7
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.2.4

  # Task runner
  vite-plus: ^0.1.20
  tsx: ^4.22.4

catalogs:
  tooling:
    "@typescript/native-preview": "7.0.0-dev.20260421.2"
    oxlint: ^1.61.0
    typescript: 6.0.3
    vite: ^8.0.10
    vitest: ^4.1.5

  workers:
    "@cloudflare/vitest-pool-workers": ^0.14.9
    "@cloudflare/workers-types": ^4.20260423.1
    drizzle-kit: ^0.31.10
    drizzle-orm: ^0.45.2
    hono: ^4.12.14
    postgres: ^3.4.9
    wrangler: ^4.84.1
confirmModulesPurge: false

allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  tldjs: true
  workerd: true
  "@webpresso/agent-vitest": true
  "@webpresso/agent-workers-test": true

overrides:
  "@commitlint/config-validator>ajv": "8.18.0"
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "@secretlint/config-loader>ajv": "8.18.0"
  "@textlint/linter-formatter>js-yaml": "3.14.2"
  "@textlint/linter-formatter>lodash": "4.18.1"
  "@voidzero-dev/vite-plus-core>yaml": "2.8.3"
  "micromatch>picomatch": "2.3.2"
  protobufjs: "7.5.5"
  "table>ajv": "8.18.0"

peerDependencyRules:
  allowedVersions:
    "vite>esbuild": "*"
